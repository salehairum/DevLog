services:
  backend:
    image: salehaa/devlog-backend:86a37a
    container_name: devlog-backend

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./backend/chroma_persist:/app/chroma_persist

    expose:
      - "5000"

    depends_on:
      - mongo

  frontend:
    image: salehaa/devlog-frontend:86a37a
    container_name: devlog-frontend

    env_file:
      - ./frontend/.env

    ports:
      - "80:80"

    depends_on:
      - backend

  mongo:
    image: mongo:6
    container_name: devlog-mongodb

    volumes:
      - mongo_data:/data/db

    expose:
      - "27017"

volumes:
  mongo_data: