---
- name: Bootstrap DevLog EC2 instance
  hosts: devlog
  become: true
  gather_facts: true

  tasks:

    # ---------------------------------------------------------
    # Basic prerequisites
    # ---------------------------------------------------------

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3
          - amazon-ecr-credential-helper
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"

    - name: Install unzip
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Extract AWS CLI v2 installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Install AWS CLI v2
      ansible.builtin.command:
        cmd: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws
    # ---------------------------------------------------------
    # Docker repository
    # ---------------------------------------------------------

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false

    - name: Configure Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components:
          - stable
        architectures:
          - amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true

    # ---------------------------------------------------------
    # Docker Engine + Compose
    # ---------------------------------------------------------

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Reset Docker service failure state
      ansible.builtin.command:
        cmd: systemctl reset-failed docker.service docker.socket
      changed_when: false

    - name: Ensure Docker socket is enabled
      ansible.builtin.systemd:
        name: docker.socket
        enabled: true
        state: started

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # ---------------------------------------------------------
    # DevLog directory
    # ---------------------------------------------------------

    - name: Create /opt/devlog
      ansible.builtin.file:
        path: /opt/devlog
        state: directory
        owner: root
        group: docker
        mode: '0775'

    # ---------------------------------------------------------
    # ECR credential helper
    # ---------------------------------------------------------

    - name: Create Docker config directory for root
      ansible.builtin.file:
        path: /root/.docker
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Configure Docker to use ECR credential helper
      ansible.builtin.copy:
        dest: /root/.docker/config.json
        owner: root
        group: root
        mode: '0600'
        content: |
          {
            "credsStore": "ecr-login"
          }

    # ---------------------------------------------------------
    # Verification
    # ---------------------------------------------------------

    - name: Verify Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Verify ECR credential helper
      ansible.builtin.command:
        cmd: docker-credential-ecr-login version
      register: ecr_helper_version
      changed_when: false

    - name: Verify AWS CLI
      ansible.builtin.command:
        cmd: aws --version
      register: aws_version
      changed_when: false

    - name: Display installed versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ compose_version.stdout }}"
          - "{{ ecr_helper_version.stdout }}"
          - "{{ aws_version.stdout }}"