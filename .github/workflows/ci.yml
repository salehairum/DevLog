```yaml
name: Build and Push Docker Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Detect changed components
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/devlog-GitHubActions
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/devlog-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/devlog-backend:${{ env.SHORT_SHA }}

      - name: Build and push frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/devlog-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/devlog-frontend:${{ env.SHORT_SHA }}

      - name: Update docker-compose.yml with changed image tags
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        env:
          SHORT_SHA: ${{ env.SHORT_SHA }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            sed -i -E "s|(${ECR_REGISTRY}/devlog-backend:)[a-zA-Z0-9._-]+|\1${SHORT_SHA}|g" compose.yml
          fi

          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            sed -i -E "s|(${ECR_REGISTRY}/devlog-frontend:)[a-zA-Z0-9._-]+|\1${SHORT_SHA}|g" compose.yml
          fi

      - name: Commit and push updated compose.yml
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add compose.yml
          git commit -m "Update compose.yml with image tags for ${{ env.SHORT_SHA }}" || echo "No changes to commit"
          git push